[project]
name = "nearthesis"
version = "0.1.0"
description = "Reproducible, keyless data layer for a data-backed long-term NEAR investment thesis (NEAR HACKATHON 2026, track: thesis)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "polars>=1.10",
    "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
nearthesis = "nearthesis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nearthesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: runs the full pipeline (determinism check)"]
