# Keyless data sources and polite-fetch settings for `make refresh`.
# Every host below answered without an API key on 2026-10-30 (see PIANO.md section 1 and docs/DATA_NOTES.md).
# No key, token or account is used anywhere in this project.

[http]
user_agent = "near-thesis/0.1 (+reproducible research; keyless; NEAR HACKATHON 2026)"
timeout_s = 90
max_attempts = 7          # tenacity retries on 429 / 5xx / network errors
backoff_initial_s = 2.0
backoff_max_s = 120.0

# Minimum seconds between two requests to the same host (PIANO.md section 4: start at 1 req/s,
# slower where a limit is published).
[http.min_interval_s]
"api.nearblocks.io" = 11.0                    # free plan: 6 req/min, 333/day, 10k/month
"api.llama.fi" = 1.0
"stablecoins.llama.fi" = 1.0
"coins.llama.fi" = 1.0
"api.coingecko.com" = 7.0                     # keyless public API, ~10 req/min is safe
"archival-rpc.mainnet.fastnear.com" = 1.5      # answered 429 at 1 req/s while tx.main.fastnear.com was also in use
"archival-rpc.mainnet.near.org" = 4.0         # "severely rate limited": fallback only
"free.rpc.fastnear.com" = 1.0
"rpc.mainnet.near.org" = 2.0
"tx.main.fastnear.com" = 1.0
"api.fastnear.com" = 1.0
"explorer.mainnet.aurora.dev" = 1.0
"api.github.com" = 5.0                        # keyless: 60 requests/hour; the fetcher also stops at 5 remaining
"raw.githubusercontent.com" = 1.0
"1click.chaindefuser.com" = 2.0
"gov.near.org" = 2.0

# Minimum seconds between two requests to any host whose name ends with the key, shared across processes
# (lock file in data/cache/). FastNear rate-limits across its services (RPC, archival, indexer, API).
[http.shared_min_interval_s]
"fastnear.com" = 0.5               # pause after each request ends (requests also start >= 1 s apart per host)

[endpoints]
nearblocks = "https://api.nearblocks.io/v1"
llama = "https://api.llama.fi"
llama_stablecoins = "https://stablecoins.llama.fi"
llama_coins = "https://coins.llama.fi"
coingecko = "https://api.coingecko.com/api/v3"
archival_rpc = "https://archival-rpc.mainnet.fastnear.com"
archival_rpc_fallback = "https://archival-rpc.mainnet.near.org"
rpc = "https://free.rpc.fastnear.com"
rpc_fallback = "https://rpc.mainnet.near.org"
fastnear_tx = "https://tx.main.fastnear.com"
fastnear_api = "https://api.fastnear.com/v1"
aurora_stats = "https://explorer.mainnet.aurora.dev/stats-service/api/v1"
aurora_api = "https://explorer.mainnet.aurora.dev/api/v2"

