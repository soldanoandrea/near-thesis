# Publishes the static dashboard (site/: plain HTML, CSS and JS generated by `make site`, no build step here) to
# GitHub Pages on every push to main.
#
# One-time setup in the repository: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The site is then at https://<owner>.github.io/<repo>/ (index.html = the thesis, dashboard.html = the charts).
# site/ is committed and tested to be byte-identical to what `make site` produces (tests/test_site.py), so this
# workflow only checks it and uploads it.
name: Dashboard (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site/ to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check the site is complete and loads only the pinned Plotly.js
        run: |
          for f in site/index.html site/dashboard.html site/assets/app.js site/assets/data.js site/assets/style.css; do
            test -s "$f" || { echo "missing $f (run make site)"; exit 1; }
          done
          if grep -hoE '<(script|link|img|iframe)[^>]+(src|href)="(https?:)?//[^"]+"' site/*.html \
               | grep -v 'https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.3/plotly.min.js'; then
            echo "site/ must not load third-party resources other than the pinned Plotly.js"; exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
